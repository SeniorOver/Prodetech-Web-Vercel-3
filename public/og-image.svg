<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080D"/>
      <stop offset="0.6" stop-color="#070C13"/>
      <stop offset="1" stop-color="#0A0F18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF6B2C" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B2C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF8A57"/>
      <stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1020" cy="80" r="380" fill="url(#glow)"/>

  <!-- Marco técnico -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" fill="none">
    <path d="M70 70H1130V560H70Z"/>
    <path d="M70 112H1130"/>
    <path d="M70 518H1130"/>
  </g>
  <g fill="#FF6B2C">
    <rect x="70" y="70" width="22" height="2"/>
    <rect x="70" y="70" width="2" height="22"/>
    <rect x="1108" y="70" width="22" height="2"/>
    <rect x="1128" y="70" width="2" height="22"/>
    <rect x="70" y="558" width="22" height="2"/>
    <rect x="70" y="538" width="2" height="22"/>
    <rect x="1108" y="558" width="22" height="2"/>
    <rect x="1128" y="538" width="2" height="22"/>
  </g>

  <!-- Marca -->
  <g transform="translate(98 88)">
    <rect width="46" height="46" rx="8" fill="#0B1119" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <path d="M23 6 37 14.5v17L23 40 9 31.5v-17Z" fill="none" stroke="#FF6B2C" stroke-width="1.7"/>
    <path d="M18 32V14h7.2a5.4 5.4 0 0 1 0 10.8H18" fill="none" stroke="#F3F1EC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="31" cy="32" r="2.3" fill="#FF6B2C"/>
  </g>
  <text x="160" y="108" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5" fill="#F3F1EC">PRODETECH</text>
  <text x="160" y="126" font-family="Menlo, monospace" font-size="9" letter-spacing="3.4" fill="#97A3B5">TECNOLOGÍA LÁSER · ECUADOR</text>

  <!-- Titular -->
  <text x="96" y="248" font-family="Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.2" fill="#F3F1EC">Tecnología láser</text>
  <text x="96" y="312" font-family="Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.2" fill="#F3F1EC">que <tspan fill="#FF6B2C">impulsa</tspan></text>
  <text x="96" y="376" font-family="Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.2" fill="#F3F1EC">tu negocio.</text>

  <text x="98" y="422" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#97A3B5">Máquinas de diodo, CO₂ y fibra para crear,</text>
  <text x="98" y="448" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#97A3B5">personalizar y producir en Ecuador.</text>

  <!-- Chips -->
  <g font-family="Menlo, monospace" font-size="11" letter-spacing="2.2" fill="#FFA57C">
    <rect x="98" y="478" width="116" height="34" fill="#FF6B2C" fill-opacity="0.08" stroke="#FF6B2C" stroke-opacity="0.3"/>
    <text x="118" y="499">DIODO</text>
    <rect x="224" y="478" width="86" height="34" fill="#FF6B2C" fill-opacity="0.08" stroke="#FF6B2C" stroke-opacity="0.3"/>
    <text x="244" y="499">CO₂</text>
    <rect x="320" y="478" width="100" height="34" fill="#FF6B2C" fill-opacity="0.08" stroke="#FF6B2C" stroke-opacity="0.3"/>
    <text x="340" y="499">FIBRA</text>
  </g>

  <!-- Pie -->
  <text x="98" y="548" font-family="Menlo, monospace" font-size="10" letter-spacing="2.6" fill="#6D7987">QUITO · PICHINCHA · ECUADOR</text>
  <text x="1102" y="548" text-anchor="end" font-family="Menlo, monospace" font-size="10" letter-spacing="2.6" fill="#FF6B2C">PRODETECHEC.COM</text>

  <!-- Visual derecho: hexágono y haz -->
  <g transform="translate(980 300)">
    <circle r="158" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4 8"/>
    <circle r="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <path d="M0 -140 121 -70v140L0 140-121 70v-140Z" fill="#080D15" stroke="#FF6B2C" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M0 -110 95 -55v110L0 110-95 55v-110Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="126" font-weight="800" fill="#F3F1EC" fill-opacity="0.92">P</text>
    <path d="M-154 -100 154 100" stroke="url(#beam)" stroke-width="2"/>
    <circle cx="-124" cy="-80" r="4" fill="#FF6B2C"/>
    <circle cx="124" cy="80" r="7" fill="#FF6B2C" fill-opacity="0.35"/>
    <circle cx="124" cy="80" r="2.5" fill="#FFB083"/>
    <text x="0" y="188" text-anchor="middle" font-family="Menlo, monospace" font-size="9" letter-spacing="3" fill="#6D7987">PRECISIÓN · CONTROL · RESULTADOS</text>
  </g>
</svg>
